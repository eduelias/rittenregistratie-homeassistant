# Home Assistant package for rittenregistratie-bot.
# Put this file in <config>/packages/ (with `homeassistant: packages: !include_dir_named packages`)
# and add to secrets.yaml:
#   rittenregistratie_hook_url: "http://<bot-host>:8000/hooks/homeassistant/<car_id>"
#   rittenregistratie_hook_secret: "<the RIT_HOOK_SECRET from the bot's .env>"
# The entity ids below (sensor.my_car_odometer, sensor.my_car_ignition_state,
# device_tracker.my_car) are placeholders: replace them with your car's
# (Developer tools → States).

input_number:
  rittenregistratie_start_odometer:
    name: RittenRegistratie start odometer
    min: 0
    max: 2000000
    step: 1
    mode: box
    unit_of_measurement: km

rest_command:
  rittenregistratie_trip_ended:
    url: !secret rittenregistratie_hook_url
    method: POST
    timeout: 20
    headers:
      X-Hook-Secret: !secret rittenregistratie_hook_secret
    content_type: "application/json"
    # start_odometer and ignition_off are passed in by the automation, which
    # captures them when the ignition goes off, before its settle delay.
    payload: >-
      {"event": "trip_ended",
       "odometer": "{{ states('sensor.my_car_odometer') }}",
       "start_odometer": "{{ start_odometer }}",
       "lat": "{{ state_attr('device_tracker.my_car', 'latitude') }}",
       "lon": "{{ state_attr('device_tracker.my_car', 'longitude') }}",
       "zone": "{{ states('device_tracker.my_car') }}",
       "ignition_off": "{{ ignition_off }}"}

automation:
  - id: rittenregistratie_ignition_on
    alias: "RittenRegistratie: remember odometer at ignition on"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.my_car_ignition_state
        to: "4"
        from:
          - "0"
          - "1"
          - "2"
          - "5"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.rittenregistratie_start_odometer
        data:
          value: "{{ states('sensor.my_car_odometer') | int(0) }}"

  - id: rittenregistratie_ignition_off
    alias: "RittenRegistratie: log trip at ignition off"
    # single: a second ignition-off inside the settle delay must not restart it
    # with a start odometer that ignition-on has overwritten in between.
    mode: single
    max_exceeded: silent
    trigger:
      - platform: state
        entity_id: sensor.my_car_ignition_state
        to: "0"
        from:
          - "4"
          - "2"
    # Evaluated when the trigger fires, so before the delay below.
    variables:
      start_odometer: "{{ states('input_number.rittenregistratie_start_odometer') | int(0) }}"
      ignition_off: "{{ trigger.to_state.last_changed.isoformat() }}"
    action:
      # Let the last odometer/position update land before reporting.
      - delay: "00:02:00"
      # Switched on again and driving: this was not the end of a trip.
      - condition: template
        value_template: "{{ is_state('sensor.my_car_ignition_state', '0') }}"
      - condition: template
        value_template: >-
          {{ states('sensor.my_car_odometer')
             not in ['unavailable', 'unknown', 'none', ''] }}
      - service: rest_command.rittenregistratie_trip_ended
        data:
          start_odometer: "{{ start_odometer }}"
          ignition_off: "{{ ignition_off }}"
